services:
  backend:
    container_name: dm-backend
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    volumes:
      - diario_mercantil_storage_data:/var/www/html/storage
    expose:
      - "9000"
    environment:
      APP_ENV: ${APP_ENV:-production}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://diariomercantil.com}
      FRONTEND_URL: ${FRONTEND_URL:-https://diariomercantil.com}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      UPLOAD_DIR: ${UPLOAD_DIR:-/var/www/html/storage/uploads}
      RESULT_DIR: ${RESULT_DIR:-/var/www/html/storage/results}
      MAX_FILE_MB: ${MAX_FILE_MB:-50}
      HEALTH_MIN_DISK_BYTES: ${HEALTH_MIN_DISK_BYTES:-524288000}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-smtps}
      SMTP_USER: ${SMTP_USER:?SMTP_USER is required}
      SMTP_PASS: ${SMTP_PASS:?SMTP_PASS is required}
      SMTP_FROM: ${SMTP_FROM:?SMTP_FROM is required}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Diario Mercantil}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "php /var/www/html/bin/readiness.php"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  worker:
    container_name: dm-worker
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    command: php /var/www/html/bin/email_worker.php
    restart: unless-stopped
    volumes:
      - diario_mercantil_storage_data:/var/www/html/storage
    environment:
      APP_ENV: ${APP_ENV:-production}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-smtps}
      SMTP_USER: ${SMTP_USER:?SMTP_USER is required}
      SMTP_PASS: ${SMTP_PASS:?SMTP_PASS is required}
      SMTP_FROM: ${SMTP_FROM:?SMTP_FROM is required}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Diario Mercantil}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "80"
    networks:
      app-network:
        ipv4_address: 172.30.0.10

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dm.rule=Host(`diariomercantil.com`) || Host(`www.diariomercantil.com`)"
      - "traefik.http.routers.dm.entrypoints=websecure"
      - "traefik.http.routers.dm.tls=true"
      - "traefik.http.routers.dm.tls.certresolver=letsencrypt"
      - "traefik.http.routers.dm.tls.domains[0].main=diariomercantil.com"
      - "traefik.http.routers.dm.tls.domains[0].sans=www.diariomercantil.com"
      - "traefik.http.services.dm.loadbalancer.server.port=80"

  db:
    image: mysql:8.0
    container_name: diario-mercantil-db-1
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME is required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: unless-stopped
    profiles: ["dev"]
    environment:
      PMA_HOST: db
      UPLOAD_LIMIT: 50M
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

volumes:
  db_data:
  diario_mercantil_storage_data:
    external: true
    name: diario_mercantil_storage_data
networks:
  app-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
